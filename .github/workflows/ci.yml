name: CI Pipeline (ML + RAG + LLM)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}:latest
  PYTHON_VERSION: "3.11"

jobs:

  # -----------------------------------
  # 1) LINTING (Ruff + Black)
  # -----------------------------------
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: pip install ruff black

      - name: Run linters
        run: |
          ruff check .
          black --check .

  # -----------------------------------
  # 2) UNIT TESTS + COVERAGE
  # -----------------------------------
  test:
    name: Run Tests (pytest + coverage)
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov fastapi uvicorn httpx

      - name: Run tests
        run: |
          pytest --cov=src --cov-report=xml --cov-fail-under=80

  # -----------------------------------
  # 3) PROMPT EVALUATION JOB
  # -----------------------------------
  prompt-eval:
    name: Automated Prompt Evaluation (amazon.csv)
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pandas

      - name: Create small eval dataset
        run: |
          python scripts/create_small_eval_dataset.py

      - name: Run prompt evaluation
        run: |
          echo "Running LLM prompt evaluation on amazon.csv"
          # python src/evaluate.py --dataset data/raw/amazon.csv
          python scripts/evaluate_prompts.py

  # -----------------------------------
  # 4) BUILD & PUSH DOCKER IMAGE (RAG API)
  # -----------------------------------
  build:
    name: Build RAG Docker Image
    needs: prompt-eval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag image (RAG API)
        run: |
          docker build \
            -f Dockerfile.rag \
            -t $IMAGE_NAME \
            -t ghcr.io/${{ github.repository }}:${{ github.sha }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push $IMAGE_NAME

  # -----------------------------------
  # 5) CANARY DEPLOYMENT (LLM SERVICE)
  # -----------------------------------
  canary-deploy:
    name: Canary Deploy (LLM API)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Start LLM canary container
        run: |
          docker run -d \
            -e CANARY=true \
            -p 8000:8000 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Wait for service
        run: sleep 10

  # -----------------------------------
  # 6) ACCEPTANCE TESTS (Golden Set)
  # -----------------------------------
  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: canary-deploy

    steps:
      - name: Golden checks
        run: |
          echo "Testing LLM service health..."
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            if [ "$STATUS" -ne 200 ]; then
              echo "❌ Health failed: $STATUS"
              exit 1
            fi
          done
          echo "✅ Golden health checks passed!"
